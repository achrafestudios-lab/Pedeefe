{% extends "base.html" %}
{% block title %}Unir PDF{% endblock %}

{% block content %}
<section class="tool-page">
    <h1>🔗 Unir PDFs</h1>
    <p>Selecciona varios PDFs para combinarlos en un solo archivo.</p>

    {% if error %}
    <div class="alert alert-error">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('unir') }}" method="POST" enctype="multipart/form-data" class="upload-form">
        <div class="drop-zone" id="dropZone">
            <p>Arrastra tus PDFs aquí o haz clic para seleccionar</p>
            <input type="file" name="files" multiple accept=".pdf" id="fileInput" required>
        </div>
        <div id="fileList" class="file-list"></div>
        <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Unir PDFs</button>
    </form>
</section>

<script>
    // Mostrar los archivos seleccionados
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const submitBtn = document.getElementById("submitBtn");

    fileInput.addEventListener("change", updateFileList);

    function updateFileList() {
        fileList.innerHTML = "";
        const files = fileInput.files;

        if (files.length === 0) {
            submitBtn.disabled = true;
            return;
        }

        for (const file of files) {
            const item = document.createElement("div");
            item.className = "file-item";
            item.textContent = file.name;
            fileList.appendChild(item);
        }

        submitBtn.disabled = files.length < 2;
        if (files.length < 2) {
            submitBtn.textContent = "Selecciona al menos 2 PDFs";
        } else {
            submitBtn.textContent = "Unir PDFs";
        }
    }

    // Drag & drop
    const dropZone = document.getElementById("dropZone");
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
    });
    dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        fileInput.files = e.dataTransfer.files;
        updateFileList();
    });
</script>
{% endblock %}
