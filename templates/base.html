<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pedeefe{% endblock %} - Herramientas PDF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo">📄 Pedeefe</a>
        <div class="nav-links">
            <a href="{{ url_for('unir') }}">Unir PDF</a>
            <a href="{{ url_for('dividir') }}">Dividir PDF</a>
            <a href="{{ url_for('comprimir') }}">Comprimir PDF</a>
            <a href="{{ url_for('pdf_a_imagen') }}">PDF a Imagen</a>
            <a href="{{ url_for('imagen_a_pdf') }}">Imágenes a PDF</a>
            <a href="{{ url_for('pdf_a_word') }}">PDF a Word</a>
            <a href="{{ url_for('rotar') }}">Rotar PDF</a>
            <a href="{{ url_for('proteger') }}">Proteger PDF</a>
            <a href="{{ url_for('desproteger') }}">Desproteger PDF</a>
            <a href="{{ url_for('ocr') }}">OCR de PDF</a>
            <a href="{{ url_for('marcar_agua') }}">Marca de agua</a>
            <a href="{{ url_for('numerar') }}">Numerar páginas</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Pedeefe — Manipula PDFs de forma local, sin subir nada a internet.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
