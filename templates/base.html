<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pedeefe{% endblock %} - Herramientas PDF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo">📄 Pedeefe</a>
        <button type="button" class="nav-toggle" id="navToggle"
                aria-label="Abrir menú de herramientas" aria-expanded="false"
                aria-controls="navLinks">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="{{ url_for('unir') }}" {% if request.endpoint == 'unir' %}aria-current="page"{% endif %}>Unir PDF</a>
            <a href="{{ url_for('dividir') }}" {% if request.endpoint == 'dividir' %}aria-current="page"{% endif %}>Dividir PDF</a>
            <a href="{{ url_for('comprimir') }}" {% if request.endpoint == 'comprimir' %}aria-current="page"{% endif %}>Comprimir PDF</a>
            <a href="{{ url_for('pdf_a_imagen') }}" {% if request.endpoint == 'pdf_a_imagen' %}aria-current="page"{% endif %}>PDF a Imagen</a>
            <a href="{{ url_for('imagen_a_pdf') }}" {% if request.endpoint == 'imagen_a_pdf' %}aria-current="page"{% endif %}>Imágenes a PDF</a>
            <a href="{{ url_for('pdf_a_word') }}" {% if request.endpoint == 'pdf_a_word' %}aria-current="page"{% endif %}>PDF a Word</a>
            <a href="{{ url_for('rotar') }}" {% if request.endpoint == 'rotar' %}aria-current="page"{% endif %}>Rotar PDF</a>
            <a href="{{ url_for('proteger') }}" {% if request.endpoint == 'proteger' %}aria-current="page"{% endif %}>Proteger PDF</a>
            <a href="{{ url_for('desproteger') }}" {% if request.endpoint == 'desproteger' %}aria-current="page"{% endif %}>Desproteger PDF</a>
            <a href="{{ url_for('ocr') }}" {% if request.endpoint == 'ocr' %}aria-current="page"{% endif %}>OCR de PDF</a>
            <a href="{{ url_for('marcar_agua') }}" {% if request.endpoint == 'marcar_agua' %}aria-current="page"{% endif %}>Marca de agua</a>
            <a href="{{ url_for('numerar') }}" {% if request.endpoint == 'numerar' %}aria-current="page"{% endif %}>Numerar páginas</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Pedeefe — Manipula PDFs de forma local, sin subir nada a internet.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
