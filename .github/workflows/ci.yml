name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ghostscript libpango-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng libreoffice

      - name: Verificar motores externos
        run: |
          pdftoppm -v 2>&1 | head -1
          tesseract --version | head -1
          soffice --version

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Comprobar sintaxis
        run: python -m py_compile app.py local_token.py cli/pedeefe.py desktop/launcher.py

      - name: Ejecutar tests
        run: python -m unittest discover -s tests
